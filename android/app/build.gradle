plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.meetyoureneeds.seller"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications 22.x
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.meetyoureneeds.seller"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
          multiDexEnabled = true
    }

   signingConfigs {
        // Only define the release signing config when key.properties is present.
        // Without it storeFile is null and Gradle fails to configure the project.
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            shrinkResources =  false
            minifyEnabled = true
        }
        debug {
            signingConfig = signingConfigs.debug
            shrinkResources = false
            minifyEnabled = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// Google Play rejects a release whose native libraries are not aligned for 16 KB
// memory pages. Everything Flutter ships is already aligned; the two that were
// not — libbarhopper_v3.so (ML Kit barcode) and libimage_processing_util_jni.so
// (CameraX) — arrive through mobile_scanner 5.2.3, which pins
// barcode-scanning 17.2.0 and camera-* 1.3.3. Both were fixed upstream, so the
// versions are forced here rather than waiting on the plugin to bump them.
//
// If the scanner ever misbehaves after a plugin upgrade, check these first: the
// forced versions may then be older than what the plugin expects.
configurations.configureEach {
    resolutionStrategy {
        force 'com.google.mlkit:barcode-scanning:17.3.0'
        force 'androidx.camera:camera-core:1.4.2'
        force 'androidx.camera:camera-camera2:1.4.2'
        force 'androidx.camera:camera-lifecycle:1.4.2'
    }
}
