name: myn_seller_app
description: This is the flutter delivery application of active ecommerce cms

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.1.8+32

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  bordered_text: ^3.0.2
  slider_button: ^3.1.0
  cached_network_image: ^3.3.1
  data_table_2: ^2.5.15
  carousel_slider: ^5.1.1
  clipboard: ^3.0.14
  cupertino_icons: ^1.0.8
  dotted_line: ^3.2.2
  dropdown_button2: ^3.1.0
  dropdown_search: ^7.0.0
  excel: ^4.0.3
  expandable: ^5.0.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_chat_bubble: ^2.0.2
  flutter_countdown_timer: ^4.1.0
  flutter_icons_null_safety: ^1.1.0
  flutter_localizations:
    sdk: flutter
  flutter_overlay_window: ^0.5.0
  flutter_rating_bar: ^4.0.1
  flutter_ringtone_player: ^4.0.0
  flutter_svg: ^2.0.10
  flutter_typeahead: ^6.0.0
  flutter_widget_from_html: ^0.17.2
  fluttertoast: ^9.1.0
  google_fonts: ^8.2.1
  google_nav_bar: ^5.0.6
  flutter_local_notifications: ^22.3.0
  http: ^1.2.1
  image_picker: ^1.1.2
  # Barcode scanning on the add-product screen. Wraps ML Kit on Android, so it
  # reads the EAN-13 printed on a pack without a network round trip.
  mobile_scanner: ^5.2.3
  intl_phone_number_input: ^0.7.4
  json_annotation: ^4.9.0
  logging: ^1.2.0
  one_context: ^4.0.0
  open_file: ^4.0.0
  share_plus: ^13.3.0
  path_provider: ^2.1.3
  # Pinned below 13.x: permission_handler_android 14.0.0 requires AGP 9.0.1,
  # Kotlin 2.3.20 and compileSdk 37, which the rest of the plugin set does not
  # yet support. Revisit once the ecosystem moves to AGP 9.
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  provider: ^6.1.2
  rename: ^3.0.2
  rflutter_alert: ^2.0.7
  shared_preferences: ^2.2.3
  shared_value: ^3.0.0
  shimmer: ^3.0.0
  syncfusion_flutter_xlsio: ^29.2.11
  timeline_list: ^0.1.1
  timeline_tile: ^2.0.0
  toast: ^0.3.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  flutter_timer_countdown: ^1.0.7
  internet_connection_checker_plus: ^3.1.1
  package_info_plus: ^10.2.1

dev_dependencies:
  build_runner: ^2.4.10
  empty_widget_fork: ^0.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  google_maps_flutter: ^2.6.1
  json_serializable: ^6.8.0
  route_transitions: ^2.0.1

# flutter_icons_null_safety 1.1.0 is the last published version and subclasses
# IconData, which Flutter now seals as a final class, so it no longer compiles.
# third_party/ holds a patched copy whose icon constants are plain IconData
# literals; the API and font assets are otherwise identical to upstream.
dependency_overrides:
  flutter_icons_null_safety:
    path: third_party/flutter_icons_null_safety

flutter_launcher_icons:
  image_path: "assets/image/icon.png"
  android: true
  ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter:
  uses-material-design: true

  assets:
    - assets/
  #    - dummy_assets/
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
